<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Manu Sánchez Fotografía Cofrade</title>
  <meta name="description" content="Fotografía de Semana Santa, hermandades y cofradías. Capturando la fe, el sentimiento y la tradición.">
  <meta name="theme-color" content="#0b0a09">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_ES">
  <meta property="og:site_name" content="Manu Sánchez Fotografía Cofrade">
  <meta property="og:title" content="Manu Sánchez Fotografía Cofrade">
  <meta property="og:description" content="Fotografía de Semana Santa, hermandades y cofradías. Capturando la fe, el sentimiento y la tradición.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500&display=swap">
  <script>
    // DIAGNÓSTICO TEMPORAL: muestra en pantalla cualquier error de JavaScript. Se retirará al resolverlo.
    (function () {
      function show(msg) {
        var m = document.getElementById('app');
        if (!m) return;
        m.innerHTML = '<pre style="padding:6rem 1.5rem;margin:0;min-height:100vh;background:#0b0a09;color:#f3ede2;white-space:pre-wrap;font:14px monospace">ERROR DE LA WEB:\n' + msg + '</pre>';
      }
      window.addEventListener('error', function (e) {
        if (e.message) show(e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        show(String((e.reason && (e.reason.stack || e.reason.message)) || e.reason));
      });
    })();
  </script>
</head>
<body>
  <main id="app" tabindex="-1"></main>
  <noscript><p style="padding:6rem 1.5rem;color:#f3ede2;font-family:sans-serif">Esta web necesita JavaScript para mostrar las galerías.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
